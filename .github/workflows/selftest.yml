# The bridge's own unwired-checker instance: `--selftest` existed for days and
# nothing ran it. It was a script somebody had to remember -- the same shape as
# BD's verify_gates_actually_fire.py, which required a manual traced pytest run
# before it meant anything. A checker nobody runs is a checker that does not
# exist, and this repository had spent several commits saying so.
name: selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--resolve` git-resolves the `rev` on every bridge-internal
          # citation, and checkout's default `fetch-depth: 1` leaves one
          # commit in the clone -- four citations then report
          # `rev_missing` for a history that is simply not there. The
          # step passed locally and failed on its first CI run, which is
          # this file's own warning about two platforms that had never
          # intersected, arriving by return of post.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deliberately pinned to the imports --selftest treats as mandatory.
      # Their absence is an error under --selftest, not a skip, so a missing
      # dependency here fails the job rather than quietly disabling R1.
      - run: pip install jsonschema referencing PyYAML
      - run: python3 validate.py --selftest
      # R6's resolve branch, rootless. It resolves every
      # `<side>:bridge/...` ref -- path AND cited `rev` -- against this
      # checkout: 11 of them, no configuration, and it exits non-zero if
      # it resolved nothing rather than reporting a vacuous pass. The
      # `am:`/`bd:` refs stay `no_root` here; see the note below.
      - run: python3 validate.py --resolve

# WHAT THIS JOB DOES NOT COVER, stated rather than implied -- BD's ci.yml does
# the same and it is the half that keeps a green tick honest.
#
# * **Only ubuntu-latest.** Development happens on darwin-arm64, so "selftest
#   clean locally" and "CI green" are two platforms and neither implies the
#   other. The risk here is small (stdlib plus three pure-Python packages, and
#   the two path tests use `as_posix()` and a component match) but it is not
#   zero and it is not checked.
# * **Unpinned dependency versions.** `pip install jsonschema referencing
#   PyYAML` takes whatever is current, so a schema-library change can turn this
#   red without any commit here. That is deliberate: a pin would hide the
#   change until somebody bumped it.
# * **Nothing about the two agent repositories.** Refs beginning `am:` and
#   `bd:` are verified against `hashes.json` only. R6's `--resolve` branch does
#   open the files now, and it is NOT run here: it needs checkouts of both
#   agent repositories, and pointing this job at their default branches would
#   be worse than not running it -- this thread's AM half lives on a worktree
#   branch that is on neither `main` nor `version2`, so a green tick would mean
#   "nine refs missing" or "nine refs fine" depending on nothing.
#   The rootless half IS wired, above. It resolves every `<side>:bridge/...`
#   ref against this checkout -- 11 of them -- and it found both of the real
#   defects the branch turned up: r4 citing r2 at a rev where the blob is a
#   different hash, and r9 pinning r7 to a commit that predates r7. Wiring it
#   waited until both were corrected by their owning sides, because turning
#   this job red on somebody else's sealed document is their call and not this
#   file's. What is NOT covered stays not covered: an `am:` or `bd:` ref is
#   reported `no_root` and counted, never silently skipped.
